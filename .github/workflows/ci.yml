name: EarnML CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION:   "20"

jobs:

  # ─────────────────────────────────────────────────────────────
  # 1. Python tests + linting
  # ─────────────────────────────────────────────────────────────
  test-python:
    name: Python Tests & Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Lint with ruff
        run: |
          pip install ruff
          ruff check ml/ api/ monitoring/ backtesting/ mlflow_tracking/ llm_layer/ \
               --ignore E501,E402 || true   # non-blocking for portfolio project

      - name: Type check with mypy (non-blocking)
        run: |
          pip install mypy
          mypy ml/data/pipeline.py api/db.py monitoring/drift_detector.py \
               --ignore-missing-imports || true

      - name: Run tests with coverage
        env:
          PYTHONPATH: ${{ github.workspace }}
          # No real API keys in CI — tests use mocks
          ANTHROPIC_API_KEY: "sk-ant-test-key"
        run: |
          pytest tests/ -v \
            --cov=ml --cov=api --cov=monitoring \
            --cov-report=xml --cov-report=term-missing \
            --tb=short \
            -k "not test_predict_success_mock"   # skip integration test needing full stack

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: coverage.xml
          fail_ci_if_error: false

  # ─────────────────────────────────────────────────────────────
  # 2. Frontend build check
  # ─────────────────────────────────────────────────────────────
  test-frontend:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install & build
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 7

  # ─────────────────────────────────────────────────────────────
  # 3. Docker image build (validate only, no push on PRs)
  # ─────────────────────────────────────────────────────────────
  docker-build:
    name: Docker Build Validation
    runs-on: ubuntu-latest
    needs: [test-python, test-frontend]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image (validate only)
        uses: docker/build-push-action@v5
        with:
          context: .
          file:    docker/Dockerfile
          push:    false
          tags:    earnml-api:${{ github.sha }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max

  # ─────────────────────────────────────────────────────────────
  # 4. Deploy to Render (main branch only)
  # ─────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [test-python, test-frontend, docker-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Deploy API to Render
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -n "$RENDER_DEPLOY_HOOK" ]; then
            curl -X POST "$RENDER_DEPLOY_HOOK"
            echo "Render deploy triggered"
          else
            echo "RENDER_DEPLOY_HOOK not set — skipping deploy"
          fi

      - name: Deploy Frontend to Vercel
        env:
          VERCEL_TOKEN:   ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID:  ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -n "$VERCEL_TOKEN" ]; then
            npm i -g vercel
            cd frontend
            vercel --token "$VERCEL_TOKEN" --prod --yes
          else
            echo "Vercel secrets not set — skipping deploy"
          fi

      - name: Notify deployment
        if: always()
        run: |
          echo "Deployment completed for commit ${{ github.sha }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Status: ${{ job.status }}"
